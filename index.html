<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="refresh" content="6;url=https://z-chat-five.vercel.app" />
<title>Z Chat has moved</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237C5CFF%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>Z</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101116;
    --surface:#171921;
    --surface-2:#1e212b;
    --line:#2a2d38;
    --text:#eef0f6;
    --muted:#8b8fa3;
    --violet:#7c5cff;
    --cyan:#2eaae0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 15% 15%, rgba(124,92,255,.22), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(46,170,224,.16), transparent 42%),
      var(--bg);
    overflow:hidden;
    position:relative;
  }
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 10s ease-in-out infinite;}
  .orb1{width:280px;height:280px;background:var(--violet);top:-60px;left:-60px;}
  .orb2{width:220px;height:220px;background:var(--cyan);bottom:-40px;right:-40px;animation-delay:2s;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}

  .card{
    position:relative;z-index:1;width:100%;max-width:420px;
    background:var(--surface);border:1px solid var(--line);border-radius:22px;
    padding:40px 32px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    animation:cardIn .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

  .mark{
    width:64px;height:64px;border-radius:18px;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:900;font-size:28px;color:#fff;
    box-shadow:0 10px 30px rgba(124,92,255,.35);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(124,92,255,.35);}50%{box-shadow:0 10px 42px rgba(124,92,255,.6);}}

  h1{font-family:'Sora',sans-serif;font-size:1.5rem;font-weight:800;margin:0 0 8px;letter-spacing:-.02em;}
  p.sub{color:var(--muted);font-size:.92rem;line-height:1.5;margin:0 0 26px;}
  p.sub b{color:var(--text);}

  .go-btn{
    display:inline-flex;align-items:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--violet),#6947e0);color:#fff;
    font-family:'Sora',sans-serif;font-weight:700;font-size:.95rem;text-decoration:none;justify-content:center;
    transition:filter .15s ease, transform .1s ease;
  }
  .go-btn:hover{filter:brightness(1.08);}
  .go-btn:active{transform:scale(.98);}

  .countdown{margin-top:18px;font-size:.78rem;color:var(--muted);}
  .countdown span{color:var(--violet);font-weight:700;}

  .url-chip{
    margin-top:14px;font-size:.76rem;color:var(--muted);
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;word-break:break-all;
  }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="card">
    <div class="mark">Z</div>
    <h1>Z Chat has a new home</h1>
    <p class="sub">This version is <b>outdated</b> and no longer maintained. We rebuilt Z Chat from the ground up &mdash; head to the new site to keep chatting.</p>

    <a class="go-btn" href="https://z-chat-five.vercel.app">
      Take me to the new Z Chat &rarr;
    </a>

    <div class="countdown">Redirecting automatically in <span id="count">6</span>s&hellip;</div>
    <div class="url-chip">z-chat-five.vercel.app</div>
  </div>

  <script>
    let n = 6;
    const el = document.getElementById('count');
    const timer = setInterval(() => {
      n -= 1;
      if (el) el.textContent = n;
      if (n <= 0) clearInterval(timer);
    }, 1000);
  </script>
</body>
</html>
