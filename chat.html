<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zobro chat - chat room</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #121212;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1f1f1f;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h2 {
    margin: 0;
    font-weight: 700;
  }
  header button {
    background: #e63946;
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 20px;
    background: #181818;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .message {
    padding: 10px 14px;
    background: #222;
    border-radius: 12px;
    max-width: 75%;
    word-wrap: break-word;
  }
  .message.self {
    background: #4caf50;
    align-self: flex-end;
  }
  .message .meta {
    font-size: 0.75rem;
    color: #aaa;
    margin-bottom: 4px;
  }
  form {
    display: flex;
    padding: 10px 20px;
    background: #1f1f1f;
  }
  form input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 20px;
    border: none;
    font-size: 1rem;
  }
  form button {
    margin-left: 12px;
    padding: 12px 24px;
    border-radius: 20px;
    border: none;
    background: #4caf50;
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  form button:hover {
    background: #3a9d3a;
  }
</style>
</head>
<body>
  <header>
    <h2>zobro chat</h2>
    <button id="logoutBtn">logout</button>
  </header>

  <div id="messages"></div>

  <form id="msgForm">
    <input id="msgInput" type="text" placeholder="type your message..." autocomplete="off" />
    <button type="submit">send</button>
  </form>

  <script type="module" src="chat.js"></script>
</body>
</html>
