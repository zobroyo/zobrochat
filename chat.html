<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Z Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237C5CFF%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>Z</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101116;
    --surface:#171921;
    --surface-2:#1e212b;
    --line:#2a2d38;
    --text:#eef0f6;
    --muted:#8b8fa3;
    --violet:#7c5cff;
    --violet-soft:rgba(124,92,255,.16);
    --cyan:#2eaae0;
    --green:#3ddc84;
    --danger:#ff5c6c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  #app{display:flex;height:100vh;height:100dvh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:270px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    transition:transform .25s ease;
  }
  .side-header{
    padding:18px 18px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--line);
  }
  .side-header .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:800;font-size:17px;color:#fff;flex-shrink:0;
  }
  .side-header h1{font-family:'Sora',sans-serif;font-size:1.05rem;margin:0;font-weight:700;}
  .side-header .me{font-size:.72rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  #closeSidebar{display:none;margin-left:auto;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;}

  .side-section{padding:14px 12px 4px;}
  .side-section .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 8px 8px;font-weight:600;}

  .room-item, .user-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:2px;
    color:var(--text);
    font-size:.88rem;
    transition:background .15s ease;
    position:relative;
  }
  .room-item:hover, .user-item:hover{background:var(--surface-2);}
  .room-item.active, .user-item.active{background:var(--violet-soft);}
  .avatar{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(135deg,#3a3d4a,#2a2d38);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.8rem;color:var(--text);
    position:relative;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--green);
    border:2px solid var(--surface);
    position:absolute;bottom:-2px;right:-2px;
  }
  .dot.off{background:#5c6072;}
  .uname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .unread{
    background:var(--violet);color:#fff;font-size:.68rem;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }

  #userList{flex:1;overflow-y:auto;padding-bottom:10px;}

  .side-footer{
    border-top:1px solid var(--line);
    padding:12px;
  }
  #logoutBtn{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--danger);
    padding:10px;
    border-radius:10px;
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
    transition:background .15s ease;
  }
  #logoutBtn:hover{background:rgba(255,92,108,.1);}

  /* ---------- Main ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  #chatHeader{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    background:var(--surface);
  }
  #menuBtn{display:none;background:none;border:none;color:var(--text);font-size:1.3rem;cursor:pointer;padding:0 4px;}
  #chatTitle{display:flex;align-items:center;gap:10px;min-width:0;}
  #chatTitle .avatar{width:36px;height:36px;}
  #chatTitleText h2{margin:0;font-size:1rem;font-family:'Sora',sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;}
  #chatTitleText p{margin:0;font-size:.74rem;color:var(--muted);}

  #bellBtn{
    margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);
    width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  #bellBtn.on{color:var(--violet);border-color:var(--violet);}

  #messages{
    flex:1;overflow-y:auto;
    padding:18px 20px;
    display:flex;flex-direction:column;gap:10px;
  }
  .msg{
    max-width:72%;
    padding:10px 13px;
    border-radius:14px;
    background:var(--surface-2);
    font-size:.9rem;
    line-height:1.4;
    align-self:flex-start;
    animation:slideIn .18s ease;
    word-wrap:break-word;
  }
  .msg.self{
    background:linear-gradient(135deg,var(--violet),#6947e0);
    align-self:flex-end;
    color:#fff;
  }
  .msg .meta{font-size:.68rem;color:var(--muted);margin-bottom:3px;font-weight:500;}
  .msg.self .meta{color:rgba(255,255,255,.75);}
  @keyframes slideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .empty-state{
    margin:auto;text-align:center;color:var(--muted);font-size:.88rem;padding:30px;
  }

  #composer{
    display:flex;gap:10px;
    padding:14px 20px;
    border-top:1px solid var(--line);
    background:var(--surface);
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
  }
  #msgInput{
    flex:1;
    padding:12px 16px;
    border-radius:22px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:.92rem;
    outline:none;
    font-family:'Inter',sans-serif;
  }
  #msgInput:focus{border-color:var(--violet);}
  #sendBtn{
    width:44px;height:44px;border-radius:50%;
    border:none;
    background:linear-gradient(135deg,var(--violet),#6947e0);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:transform .1s ease, filter .15s ease;
  }
  #sendBtn:hover{filter:brightness(1.1);}
  #sendBtn:active{transform:scale(.94);}

  /* ---------- Toasts ---------- */
  #toasts{
    position:fixed;top:16px;right:16px;
    display:flex;flex-direction:column;gap:8px;
    z-index:50;
    max-width:280px;
  }
  .toast{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-left:3px solid var(--violet);
    padding:10px 14px;
    border-radius:10px;
    font-size:.82rem;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    animation:toastIn .2s ease;
    cursor:pointer;
  }
  .toast strong{display:block;font-size:.78rem;margin-bottom:2px;}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

  /* ---------- Overlay for mobile sidebar ---------- */
  #overlay{
    display:none;
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;
  }

  @media (max-width:780px){
    #sidebar{
      position:fixed;top:0;bottom:0;left:0;z-index:20;
      transform:translateX(-100%);
      width:82vw;max-width:300px;
    }
    #sidebar.open{transform:translateX(0);}
    #overlay.show{display:block;}
    #closeSidebar{display:block;}
    #menuBtn{display:block;}
    .msg{max-width:85%;}
    #toasts{left:16px;right:16px;max-width:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="overlay"></div>

  <aside id="sidebar">
    <div class="side-header">
      <div class="mark">Z</div>
      <div>
        <h1>Z Chat</h1>
        <div class="me" id="meLabel">—</div>
      </div>
      <button id="closeSidebar">&times;</button>
    </div>

    <div class="side-section">
      <div class="label">Rooms</div>
      <div class="room-item active" id="publicRoomBtn" data-room="public">
        <div class="avatar">#</div>
        <span class="uname">General</span>
      </div>
    </div>

    <div class="side-section" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div class="label">Direct messages</div>
      <div id="userList"></div>
    </div>

    <div class="side-footer">
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main id="main">
    <header id="chatHeader">
      <button id="menuBtn">&#9776;</button>
      <div id="chatTitle">
        <div class="avatar" id="chatAvatar">#</div>
        <div id="chatTitleText">
          <h2 id="chatTitleName">General</h2>
          <p id="chatTitleSub">Public room</p>
        </div>
      </div>
      <button id="bellBtn" title="Enable notifications">&#128276;</button>
    </header>

    <div id="messages"><div class="empty-state">Loading messages...</div></div>

    <form id="composer">
      <input id="msgInput" type="text" placeholder="Message..." autocomplete="off" />
      <button id="sendBtn" type="submit" title="Send">&#10148;</button>
    </form>
  </main>
</div>

<div id="toasts"></div>

<script type="module" src="chat.js"></script>
</body>
</html>
