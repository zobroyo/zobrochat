<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0b0d" />
<meta http-equiv="refresh" content="6;url=https://zchat.men" />
<title>Z Chat has a new home</title>
<link rel="icon" href="icon-192.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="splash">
    <div class="glow" aria-hidden="true"></div>

    <div class="splash-inner">
      <header class="brand">
        <div class="mark" aria-hidden="true">Z</div>
        <div>
          <p class="eyebrow">z chat</p>
          <h1>This chat has a new home</h1>
        </div>
      </header>

      <section class="card-lg">
        <p class="lede">This version is <strong>outdated</strong> and no longer maintained. We rebuilt Z Chat from the ground up &mdash; head to the new site to keep chatting.</p>

        <a class="btn btn-primary" href="https://zchat.men">
          Continue to the new Z Chat
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
        </a>

        <div class="meta">
          <span class="eyebrow">address</span>
          <span class="chip">zchat.men</span>
        </div>

        <p class="countdown">Redirecting automatically in <span id="count">6</span>s&hellip;</p>
      </section>
    </div>
  </main>

  <script>
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--background").trim();
    if (bg) document.querySelector('meta[name="theme-color"]')?.setAttribute("content", bg);

    let n = 6;
    const el = document.getElementById("count");
    const timer = setInterval(() => {
      n -= 1;
      if (el) el.textContent = n;
      if (n <= 0) clearInterval(timer);
    }, 1000);
  </script>
</body>
</html>
